 <title id="chart-title">Output-contract matches by synthetic task family</title><desc id="chart-desc">On four JSON configuration tasks one-shot draft met the output contract once; checked loop and Nisi each met it four times. On four classification tasks all arms met the contract four times. On four text extraction tasks one-shot draft met it once; checked loop and Nisi each met it four times. All six one-shot contract misses had the correct value but omitted the required answer wrapper. One-shot had no repair opportunity; checked loop and Nisi had one. Result SHA-256 17c117821d347bf4ad248b70b319d8847bbedc2647edebf6b0a2e8edf996b10a; frozen dataset SHA-256 cef0921e2104650b4c7f1f5f0612379d35bbe393c6152811f9236543a8a20a40.</desc><metadata>
