name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Every Node test runs on Linux and Windows. The Apple executor tests use
    # stand-in probes; their Windows fixture launcher does not run Apple models.
    # Swift probes under probes/ need a separate Apple environment.
    # Linux uses GitHub-hosted Ubuntu; same-repo Windows uses pc-win. Fork PRs stay hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.os == 'windows-latest' && fromJSON('["self-hosted","pc-win"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Structural check and full Node test suite
        run: npm run check
      - name: Installed public CLI package
        run: npm run check:cli-package
      - name: Editable README consistency
        run: node docs/editor/check-editor.mjs ./index-typing-revision.html

  python:
    # The Python scripts are benchmark generators and chart renderers; none ships in the npm package.
    # Ruff is pinned so a Ruff release cannot change the result. Bump it in its own pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.17.4
      - name: Ruff lint
        run: ruff check --output-format github .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Frozen harder task sets are reproduced byte for byte
        run: python -I benchmarks/harder/check_reproducible.py
      - name: Harder-v2 generator unit tests
        run: python -I benchmarks/harder/v2/test_generators.py
      - name: Package footprint chart matches its manifest
        run: python -I benchmarks/value/footprint/render.py --check
