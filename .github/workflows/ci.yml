name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Every Node test runs on Linux and Windows, including the executor suite,
    # which uses stand-in probes. The Swift probes under probes/ need a separate
    # Apple environment and are not built here.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Scoped static analysis check on the codec
        run: npm run check:static
      - name: Tests
        run: npm test
      - name: Editable README consistency
        run: node docs/editor/check-editor.mjs ./index-typing-revision.html
